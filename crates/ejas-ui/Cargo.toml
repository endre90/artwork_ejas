[package]
name = "ejas-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ejas-ui"
path = "src/main.rs"

[dependencies]
# Deliberately no `artwork_ejas` dependency: that would pull in z3, which
# cannot be compiled to wasm32. All solving happens over HTTP.
ejas-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# default-features off keeps wgpu and the accessibility stack out; the glow
# backend plus the two Linux window systems are all this needs.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"
ehttp = "0.5"
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Location"] }
log = { workspace = true }
console_log = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
log = { workspace = true }
pollster = "0.4"
