[package]
name = "artwork_ejas"
version = "0.1.0"
authors = ["Endre Erős <endre.eros@chalmersindustriteknik.se>"]
edition = "2021"
autotests = false

[dependencies]
z3 = { git = "https://github.com/endre90/z3.rs", branch = "master" }
nanoid = "0.4.0"
inquire = "0.7.5"
json = "0.12.4"
rand = "0.8.5"
log = "0.4.21"
serde_json = "1.0.127"
serde = { version = "1.0.209", features = ["derive"] }
rusqlite = "0.32.1"
eframe = "0.27.2"

[[bin]]
name = "main"
path = "src/main.rs"