[workspace]
members = [".", "crates/ejas-core", "crates/ejas-server", "crates/ejas-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Endre Erős <endre.eros@chalmersindustriteknik.se>"]

[workspace.dependencies]
ejas-core = { path = "crates/ejas-core" }
artwork_ejas = { path = "." }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
log = "0.4.21"

[package]
name = "artwork_ejas"
version.workspace = true
edition.workspace = true
authors.workspace = true
autotests = false

[dependencies]
# No `bundled` / `static-link-z3` feature: this links dynamically against a
# system libz3, so a prebuilt distro package (libz3-dev) is enough and Z3
# never has to be compiled from source. Pinned by rev, not branch, so builds
# are reproducible.
z3 = { git = "https://github.com/endre90/z3.rs", rev = "73e2475973701724b38e325f150e3011750c5fed" }
ejas-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
